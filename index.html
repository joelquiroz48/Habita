<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de IA</title>

    <!-- Enlaces de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Black+Ops+One&family=Playwrite+AU+VIC+Guides&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="contenedor-ia">
        <img src="img/fondo-principal.jpg" alt="Fondo principal del chat" class="fondo-principal-chat">

        <h1>
            Asistente Habita
        </h1>
        <section class="cuerpo">
            <h3>
                ¿Necesitas ayuda con tus expensas?
            </h3>
            <img class="img-ia" src="img/habita-asistente.png" alt="imagen de asistente de habita">
            <button type="button" class="btn-iniciar-chat">
                <img src="img/globo-texto.png" alt="globo de texto" class="img-boton-ia">
                Hablar con Habita
            </button>
        </section>        
    </div>

    <div class="ia-pantalla-chat">
        <img src="img/fondo-chat-2.jpg" alt="fondo de chat - fotos edificios" class="fondo-chat-ia">
        
        <div class="barra-superior">
            <img src="img/x-cerrar-chat.png" alt="cerrar chat" class="x-cerrar-chat">
        </div>

        <div class="win-chat">
            <div class="msj-chat">
                Hola! este es un mensaje del chat
            </div>
            <div class="msj-usr">
                y este es un mensaje del usuario
            </div>

        </div>

        <div class="msg-box">
            <input type="text" class="msg-input" placeholder="Escribe tu mensaje...">
            <img src="img/send-btn.png" alt="Botón enviar mensaje" class="send-btn">
        </div>
    </div>




    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
